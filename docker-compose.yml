services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: rustfs-hw3
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data/disk{1...4}"
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - ./rustfs-data/disk1:/data/disk1
      - ./rustfs-data/disk2:/data/disk2
      - ./rustfs-data/disk3:/data/disk3
      - ./rustfs-data/disk4:/data/disk4
    restart: unless-stopped
